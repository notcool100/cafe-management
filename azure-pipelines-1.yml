trigger:
  branches:
    include:
      - uat
  paths:
    include:
      - fe/**
      - be/**

pool:
  name: 'Astro'

variables:
  nodeVersion: '24.x'

stages:
- stage: BuildFrontend 
  displayName: 'Build Frontend'
  jobs:
  - job: BuildFrontendJob
    displayName: 'Build Next.js App'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Install Node.js'

    - task: DownloadSecureFile@1
      name: downloadFeEnv
      inputs:
        secureFile: 'fe.env.uat'
      displayName: 'Download frontend UAT env file'
    
    - script: |
        cd fe
        pnpm install
        
        # Ensure environment files are properly set up
        echo "Setting up environment files for build"
        cp "$(downloadFeEnv.secureFilePath)" .env
      displayName: 'Install Frontend Dependencies'
    
    - script: |
        cd fe
        echo "Running TypeScript check with skipLibCheck flag"
        pnpm type-check || true
      displayName: 'Run TypeScript Check (Non-blocking)'
    
    - script: |
        cd fe
        echo "Building frontend application with TypeScript errors ignored"
        NODE_OPTIONS=--max_old_space_size=4096 pnpm run build
      displayName: 'Build Frontend Application'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'fe'
        includeRootFolder: false
        archiveType: 'tar'
        tarCompression: 'gz'
        archiveFile: '$(Build.ArtifactStagingDirectory)/cafe-frontend.tar.gz'
        replaceExistingArchive: true
    
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/cafe-frontend.tar.gz'
        ArtifactName: 'cafe-frontend'
        publishLocation: 'Container'

- stage: BuildBackend
  displayName: 'Build Backend'
  jobs:
  - job: BuildBackendJob
    displayName: 'Build Node.js API'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Install Node.js'

    - task: DownloadSecureFile@1
      name: downloadBeEnv
      inputs:
        secureFile: 'be.env.uat'
      displayName: 'Download backend UAT env file'
    
    - script: |
        cd be
        pnpm install
      displayName: 'Install Backend Dependencies'

    - script: |
        cd be
        echo "Setting up environment files for backend build"
        cp "$(downloadBeEnv.secureFilePath)" .env
      displayName: 'Setup Backend Environment'

    - script: |
        cd be
        pnpm prisma:generate
      displayName: 'Generate Prisma Client'
    
    - script: |
        cd be
        pnpm run build
      displayName: 'Build Backend Application'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'be'
        includeRootFolder: false
        archiveType: 'tar'
        tarCompression: 'gz'
        archiveFile: '$(Build.ArtifactStagingDirectory)/cafe-backend.tar.gz'
        replaceExistingArchive: true
    
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/cafe-backend.tar.gz'
        ArtifactName: 'cafe-backend'
        publishLocation: 'Container'

- stage: DeployUAT
  displayName: 'Deploy to UAT'
  dependsOn: 
    - BuildFrontend
    - BuildBackend
  condition: and(succeeded('BuildFrontend'), succeeded('BuildBackend'), eq(variables['Build.SourceBranch'], 'refs/heads/uat'))
  jobs:
  - job: DeployFrontendDev
    displayName: 'Deploy Frontend to Dev'
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'cafe-frontend'
        downloadPath: '$(System.ArtifactsDirectory)'

    - script: |
         # Extract to UAT directory
         mkdir -p /var/www/cafe-management-uat/frontend
         tar -xzf $(System.ArtifactsDirectory)/cafe-frontend-uat/cafe-frontend-uat.tar.gz -C /var/www/cafe-management-uat/frontend
         
         # Crucial: Install dependencies on the VPS because pnpm symlinks are not portable
         cd /var/www/cafe-management-uat/frontend
         pnpm install --frozen-lockfile
         
         sudo systemctl restart cafe-frontend-uat
         sudo systemctl status cafe-frontend-uat --no-pager
      displayName: 'Deploy and Restart Frontend UAT'

  - job: DeployBackendDev
    displayName: 'Deploy Backend to Dev'
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'cafe-backend'
        downloadPath: '$(System.ArtifactsDirectory)'

    - script: |
         # Extract to UAT directory
         mkdir -p /var/www/cafe-management-uat/backend
         tar -xzf $(System.ArtifactsDirectory)/cafe-backend-uat/cafe-backend-uat.tar.gz -C /var/www/cafe-management-uat/backend
         
         cd /var/www/cafe-management-uat/backend
         pnpm install --frozen-lockfile
         pnpm prisma:generate
         
         # Forcefully clear the port in case of zombie processes
         sudo fuser -k 6002/tcp || true
         
         sudo systemctl restart cafe-backend-uat
         sudo systemctl status cafe-backend-uat --no-pager
      displayName: 'Deploy and Restart Backend UAT'
